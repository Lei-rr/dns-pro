name: deploy

# 镜像发布完成后，把华为云香港节点升级到刚发布的标签。
# 触发：verify 在 v* 标签上成功（此时 GHCR 镜像已推送），或手动指定标签。
# 依赖仓库 secrets：DEPLOY_HOST、DEPLOY_USER、DEPLOY_PASSWORD（可选 DEPLOY_PORT）。
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 要部署的标签（如 v1.2.4；留空则取最新的 v* 标签）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-huawei
  cancel-in-progress: false

jobs:
  deploy:
    # 只在标签发布链上跑：verify 成功且触发它的 ref 是 v* 标签，或手动触发
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析目标镜像
        id: target
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${HEAD_BRANCH:-}}"
          if [ -z "$tag" ]; then
            tag="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' \
              | awk -F/ '{print $NF}' | sort -V | tail -1)"
          fi
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # 生产容器跟随 :latest。docker job 只在 v* 标签上构建，latest 因此始终等于最新发布。
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
          echo "本次部署：$tag（镜像 ghcr.io/${GITHUB_REPOSITORY,,}:latest）"

      - name: 校验部署凭据
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::warning::未配置 DEPLOY_HOST / DEPLOY_USER / DEPLOY_PASSWORD，跳过部署。配置后重跑本 workflow 即可。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 sshpass
        if: steps.guard.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: 在华为云节点执行升级
        if: steps.guard.outputs.ready == 'true'
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          IMAGE: ${{ steps.target.outputs.image }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE='$IMAGE' bash -s" < scripts/deploy-remote.sh

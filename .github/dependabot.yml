# Dependabot 配置：每周更新 npm（根工作区 / web 工作区）、Docker 基础镜像与 GitHub Actions。
# 分组策略：npm 按生产 / 开发依赖分成两组，组内只合并 minor + patch；
# major 升级始终单独出 PR，避免被组内合并掩盖破坏性变更。
# 每个生态 / 目录的未合并 PR 上限 5，防止版本噪音淹没仓库。
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-production:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-web-production:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-web-development:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Dockerfile 使用 node:20-bookworm-slim；基础镜像更新也走分组 + 限额
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker-images:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
